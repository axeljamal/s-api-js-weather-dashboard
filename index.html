<!DOCTYPE html>
<html lang="en-gb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2a4a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Weather Dashboard</title>
  </head>

  <body data-theme="default">
    <!-- animated background blobs that the glass panels blur -->
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <div class="app">
      <header class="glass app-header">
        <h1>Weather Dashboard</h1>
      </header>

      <aside class="glass sidebar">
        <h2 id="form-heading" class="label">Search for a city</h2>
        <form id="search-form" class="search" autocomplete="off">
          <input
            class="search-input"
            type="text"
            id="search-input"
            placeholder="e.g. London"
            aria-labelledby="form-heading"
            aria-controls="today forecast"
          />
          <button type="submit" class="btn btn-primary" id="search-button">
            Search
          </button>
        </form>
        <p class="error-msg hide" role="alert"></p>

        <div class="history-head hide" id="history-head">
          <h2 class="label">Recent</h2>
          <button type="button" class="btn-link" id="clear-history">
            Clear
          </button>
        </div>
        <div class="history" id="history"></div>
      </aside>

      <main class="content">
        <section
          id="today"
          class="glass today"
          role="region"
          aria-live="polite"
        >
          <p class="placeholder">Search for a city to see the weather.</p>
        </section>

        <h2 class="label forecast-title hide" id="forecast-title">
          5-day forecast
        </h2>
        <section
          id="forecast"
          class="forecast"
          role="region"
          aria-live="polite"
        ></section>
      </main>
    </div>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
